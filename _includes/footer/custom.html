<!-- start custom footer snippets -->

<!-- 访客统计：数据返回后才显示，保持低调；若统计服务不可用则始终隐藏 -->
<div class="visitor-counter" id="visitor-counter" style="display:none">
  <span class="visitor-counter__item">
    <i class="fas fa-user" aria-hidden="true"></i>
    访客 <span id="busuanzi_value_site_uv">--</span>
  </span>
  <span class="visitor-counter__sep">&middot;</span>
  <span class="visitor-counter__item">
    <i class="fas fa-eye" aria-hidden="true"></i>
    访问 <span id="busuanzi_value_site_pv">--</span>
  </span>
</div>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
  (function () {
    var box = document.getElementById('visitor-counter');
    if (!box) return;
    var uv = document.getElementById('busuanzi_value_site_uv');
    var tries = 0;
    // 轮询等待统计数据写入 DOM，成功后显示；超时（约 30 秒）则保持隐藏
    var timer = window.setInterval(function () {
      tries += 1;
      var text = uv ? (uv.textContent || '').trim() : '';
      if (/^[0-9]+$/.test(text)) {
        box.style.display = '';
        window.clearInterval(timer);
      } else if (tries > 60) {
        window.clearInterval(timer);
      }
    }, 500);
  })();
</script>

<!-- end custom footer snippets -->
